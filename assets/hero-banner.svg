<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181f2f" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#121724" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="antigravGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="claudeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="codexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 28px; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; fill: #f8fafc; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
    .code-text { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; fill: #38bdf8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="600" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="600" fill="url(#grid)" />

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="1200" height="52" rx="16" fill="#131926" />
  <rect x="0" y="36" width="1200" height="16" fill="#131926" />
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#222c40" stroke-width="1.5" />

  <!-- Window Dots -->
  <circle cx="28" cy="26" r="6" fill="#ef4444" />
  <circle cx="48" cy="26" r="6" fill="#f59e0b" />
  <circle cx="68" cy="26" r="6" fill="#10b981" />

  <!-- Center Window Title -->
  <text x="600" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b">
    Agent HQ — Multi-Agent Virtual Control Plane
  </text>

  <!-- Header Branding Section -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="42" height="42" rx="10" fill="#3b82f6" />
    <circle cx="15" cy="18" r="3.5" fill="#ffffff" />
    <circle cx="27" cy="18" r="3.5" fill="#ffffff" />
    <rect x="14" y="27" width="14" height="4" rx="2" fill="#ffffff" />
    
    <text x="56" y="24" class="title">Agent HQ</text>
    <text x="56" y="44" class="subtitle">Unified Visual Mission Control &amp; Office Simulator for Coding Agents</text>
  </g>

  <!-- ==================== LEFT PANEL: THE VIRTUAL OFFICE ==================== -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <!-- Room Container -->
    <rect width="520" height="380" rx="16" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1.5" />
    <rect width="520" height="36" rx="16" fill="#161e2e" />
    <rect y="20" width="520" height="16" fill="#161e2e" />
    <line x1="0" y1="36" x2="520" y2="36" stroke="#27354f" stroke-width="1" />
    
    <text x="20" y="24" class="card-title" font-size="13">🏢 Virtual Office Floor</text>
    <rect x="420" y="10" width="85" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <circle cx="430" cy="19" r="3.5" fill="#10b981" />
    <text x="440" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#10b981">LIVE FLEET</text>

    <!-- Isometric Floor Tiles Pattern -->
    <g opacity="0.15">
      <path d="M 40 100 L 260 210 L 40 320 L -180 210 Z" fill="#3b82f6" />
      <path d="M 260 100 L 480 210 L 260 320 L 40 210 Z" fill="#6366f1" />
    </g>

    <!-- 1. Antigravity Agent Desk (Zero-G Float) -->
    <g transform="translate(65, 80)">
      <!-- Ambient Orbit Glow -->
      <ellipse cx="60" cy="130" rx="42" ry="14" fill="#000" opacity="0.4" />
      <ellipse cx="60" cy="65" rx="50" ry="24" fill="none" stroke="url(#antigravGlow)" stroke-width="1.5" opacity="0.8" stroke-dasharray="4 3" />
      <circle cx="105" cy="58" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
      
      <!-- Character Body (Floating) -->
      <rect x="36" y="25" width="48" height="52" rx="14" fill="#3b82f6" />
      <circle cx="48" cy="45" r="4.5" fill="#fff" />
      <circle cx="72" cy="45" r="4.5" fill="#fff" />
      <circle cx="49" cy="46" r="2" fill="#0f172a" />
      <circle cx="73" cy="46" r="2" fill="#0f172a" />
      
      <!-- Halo / Antigrav Core -->
      <ellipse cx="60" cy="18" rx="20" ry="6" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)" />

      <!-- Desk & Hologram -->
      <rect x="20" y="95" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <polygon points="45,95 75,95 82,75 38,75" fill="#38bdf8" fill-opacity="0.25" />
      
      <text x="60" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Antigravity</text>
      <text x="60" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Zero-G Orbit</text>
    </g>

    <!-- 2. Claude Agent Desk (Royal Crown & Companion) -->
    <g transform="translate(215, 80)">
      <ellipse cx="60" cy="130" rx="38" ry="12" fill="#000" opacity="0.4" />
      
      <!-- Crown -->
      <path d="M 46 22 L 53 32 L 60 18 L 67 32 L 74 22 L 72 36 L 48 36 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
      <circle cx="60" cy="16" r="2" fill="#fef08a" />
      
      <!-- Body -->
      <rect x="38" y="35" width="44" height="48" rx="12" fill="#ea580c" />
      <circle cx="48" cy="52" r="4.5" fill="#fff" />
      <circle cx="72" cy="52" r="4.5" fill="#fff" />
      <circle cx="49" cy="53" r="2" fill="#0f172a" />
      <circle cx="73" cy="53" r="2" fill="#0f172a" />

      <!-- Desk & Companion -->
      <rect x="20" y="95" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="112" cy="115" r="8" fill="#fdba74" />
      <circle cx="118" cy="111" r="3" fill="#fdba74" />
      
      <text x="60" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fdba74">Claude</text>
      <text x="60" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Code Companion</text>
    </g>

    <!-- 3. OpenAI Codex Desk (Cyber Visor & Matrix Monitor) -->
    <g transform="translate(365, 80)">
      <ellipse cx="60" cy="130" rx="38" ry="12" fill="#000" opacity="0.4" />
      
      <!-- Body & Visor -->
      <rect x="38" y="35" width="44" height="48" rx="12" fill="#0f766e" />
      <rect x="42" y="47" width="36" height="10" rx="5" fill="#10b981" filter="url(#neonGlow)" />
      
      <!-- Matrix CRT Terminal -->
      <rect x="20" y="95" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="35" y="70" width="50" height="32" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <line x1="40" y1="78" x2="65" y2="78" stroke="#10b981" stroke-width="1" />
      <line x1="40" y1="84" x2="75" y2="84" stroke="#10b981" stroke-width="1" />
      <line x1="40" y1="90" x2="55" y2="90" stroke="#10b981" stroke-width="1" />

      <text x="60" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Codex</text>
      <text x="60" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Matrix Phosphor</text>
    </g>

    <!-- Bottom Office Features Banner -->
    <rect x="20" y="270" width="480" height="90" rx="10" fill="#121724" stroke="#222c40" stroke-width="1" />
    <g transform="translate(40, 290)">
      <!-- Feature 1 -->
      <circle cx="10" cy="12" r="8" fill="#3b82f6" fill-opacity="0.2" />
      <text x="10" y="16" text-anchor="middle" font-size="10" fill="#60a5fa">⚡</text>
      <text x="26" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">Interactive Watercooler &amp; Coffee</text>
      <text x="26" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Steaming coffee, sip actions, idle stretching</text>

      <!-- Feature 2 -->
      <circle cx="260" cy="12" r="8" fill="#10b981" fill-opacity="0.2" />
      <text x="260" y="16" text-anchor="middle" font-size="10" fill="#34d399">✨</text>
      <text x="276" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">Turn-End Confetti &amp; 8-Bit Chimes</text>
      <text x="276" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Procedural Web Audio API sound cues</text>

      <!-- Feature 3 -->
      <circle cx="10" cy="50" r="8" fill="#f59e0b" fill-opacity="0.2" />
      <text x="10" y="54" text-anchor="middle" font-size="10" fill="#fbbf24">🔍</text>
      <text x="26" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">Inline Syntax-Highlighted Diff Modal</text>
      <text x="26" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">1-click unified &amp; split diff inspection</text>

      <!-- Feature 4 -->
      <circle cx="260" cy="50" r="8" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="260" y="54" text-anchor="middle" font-size="10" fill="#a78bfa">📟</text>
      <text x="276" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">In-Browser CRT Terminal Drawer</text>
      <text x="276" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Live streaming stdout, thoughts, &amp; traces</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: MULTI-AGENT CONTROL PLANE ==================== -->
  <g transform="translate(615, 160)" filter="url(#shadow)">
    <!-- Architecture Container -->
    <rect width="525" height="380" rx="16" fill="url(#cardGrad)" stroke="#27354f" stroke-width="1.5" />
    <rect width="525" height="36" rx="16" fill="#161e2e" />
    <rect y="20" width="525" height="16" fill="#161e2e" />
    <line x1="0" y1="36" x2="525" y2="36" stroke="#27354f" stroke-width="1" />
    
    <text x="20" y="24" class="card-title" font-size="13">⚙️ Multi-Agent Orchestration Architecture</text>
    
    <!-- 3 Core Adapters Cards -->
    <g transform="translate(20, 52)">
      <!-- Antigravity Card -->
      <rect width="485" height="66" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <circle cx="24" cy="33" r="12" fill="#3b82f6" fill-opacity="0.15" />
      <text x="24" y="38" text-anchor="middle" font-size="13">🌌</text>
      <text x="46" y="26" class="card-title" font-size="14">Google Antigravity Engine</text>
      <text x="46" y="44" class="card-sub">Parses transcript.jsonl, tracks planner turns, tool usage, and Gemini pricing.</text>
      <rect x="400" y="16" width="70" height="20" rx="6" fill="#3b82f6" fill-opacity="0.2" />
      <text x="435" y="30" text-anchor="middle" class="badge-text" fill="#60a5fa">ADAPTER</text>

      <!-- Claude Code Card -->
      <g transform="translate(0, 76)">
        <rect width="485" height="66" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
        <circle cx="24" cy="33" r="12" fill="#ea580c" fill-opacity="0.15" />
        <text x="24" y="38" text-anchor="middle" font-size="13">👑</text>
        <text x="46" y="26" class="card-title" font-size="14">Claude Code CLI Engine</text>
        <text x="46" y="44" class="card-sub">Full roster sync, background process lifecycle, and stream-json integration.</text>
        <rect x="400" y="16" width="70" height="20" rx="6" fill="#ea580c" fill-opacity="0.2" />
        <text x="435" y="30" text-anchor="middle" class="badge-text" fill="#fb923c">ADAPTER</text>
      </g>

      <!-- OpenAI Codex Card -->
      <g transform="translate(0, 152)">
        <rect width="485" height="66" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1" />
        <circle cx="24" cy="33" r="12" fill="#10b981" fill-opacity="0.15" />
        <text x="24" y="38" text-anchor="middle" font-size="13">⚡</text>
        <text x="46" y="26" class="card-title" font-size="14">OpenAI Codex &amp; Generic CLI</text>
        <text x="46" y="44" class="card-sub">Universal CLI runner, configurable transcript directory, and process supervision.</text>
        <rect x="400" y="16" width="70" height="20" rx="6" fill="#10b981" fill-opacity="0.2" />
        <text x="435" y="30" text-anchor="middle" class="badge-text" fill="#34d399">ADAPTER</text>
      </g>

      <!-- Worktree & Dispatcher Control Bar -->
      <g transform="translate(0, 230)">
        <rect width="485" height="82" rx="10" fill="#131d2e" stroke="#253550" stroke-width="1" />
        <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🛡️ Worktree Isolation &amp; Level-1 Dispatcher</text>
        <text x="20" y="44" class="card-sub">Automated `git worktree add ~/worktrees/&lt;sid&gt;` blocks concurrent `.git/index.lock` collisions.</text>
        <text x="20" y="62" class="card-sub">1-Click `[⚡ Accept &amp; Send]` triage button resolves waiting questions without window switching.</text>
      </g>
    </g>
  </g>
</svg>
